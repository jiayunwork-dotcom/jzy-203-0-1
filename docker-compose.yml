services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lc
      POSTGRES_PASSWORD: lc
      POSTGRES_DB: learning_curve
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lc -d learning_curve"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      target: production
    environment:
      DATABASE_URL: postgres://lc:lc@db:5432/learning_curve
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # 集成测试：docker compose --profile test up --build --abort-on-container-exit test
  test:
    build:
      context: .
      target: build
    profiles: ["test"]
    environment:
      DATABASE_URL: postgres://lc:lc@db:5432/learning_curve_test
      REQUIRE_DB: "1"
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "test"]

volumes:
  dbdata:
